<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <rect x="0" y="0" width="1600" height="700" fill="#f6f3ec"/>

  <!-- sky is just background, no extra elements -->

  <!-- sea layers, far to near, opacity increases -->
  <rect x="0" y="330" width="1600" height="370" fill="#61ccbe" opacity="0.25"/>
  <rect x="0" y="400" width="1600" height="300" fill="#61ccbe" opacity="0.35"/>
  <rect x="0" y="470" width="1600" height="230" fill="#61ccbe" opacity="0.5"/>
  <rect x="0" y="560" width="1600" height="140" fill="#61ccbe" opacity="0.7"/>

  <!-- subtle wave lines -->
  <path d="M 0 420 Q 100 410 200 420 T 400 420 T 600 420 T 800 420 T 1000 420 T 1200 420 T 1400 420 T 1600 420"
        fill="none" stroke="#3b3a36" stroke-width="2" opacity="0.15"/>
  <path d="M 0 500 Q 100 490 200 500 T 400 500 T 600 500 T 800 500 T 1000 500 T 1200 500 T 1400 500 T 1600 500"
        fill="none" stroke="#3b3a36" stroke-width="2" opacity="0.15"/>
  <path d="M 0 600 Q 100 590 200 600 T 400 600 T 600 600 T 800 600 T 1000 600 T 1200 600 T 1400 600 T 1600 600"
        fill="none" stroke="#3b3a36" stroke-width="2" opacity="0.15"/>

  <!-- far shore: small Fintech land in the distance, upper right area -->
  <g opacity="0.9">
    <!-- distant landmass -->
    <ellipse cx="1260" cy="345" rx="230" ry="30" fill="#3b3a36" opacity="0.55"/>

    <!-- tiny skyline silhouette -->
    <rect x="1120" y="300" width="18" height="48" fill="#3b3a36" opacity="0.55"/>
    <rect x="1145" y="285" width="22" height="63" fill="#3b3a36" opacity="0.6"/>
    <rect x="1175" y="310" width="16" height="38" fill="#3b3a36" opacity="0.55"/>
    <rect x="1200" y="270" width="26" height="78" fill="#3b3a36" opacity="0.65"/>
    <rect x="1235" y="295" width="18" height="53" fill="#3b3a36" opacity="0.55"/>
    <rect x="1262" y="255" width="30" height="93" fill="#3b3a36" opacity="0.7"/>
    <rect x="1300" y="290" width="20" height="58" fill="#3b3a36" opacity="0.55"/>
    <rect x="1330" y="305" width="16" height="43" fill="#3b3a36" opacity="0.5"/>
    <rect x="1355" y="280" width="22" height="68" fill="#3b3a36" opacity="0.6"/>
    <rect x="1385" y="315" width="14" height="33" fill="#3b3a36" opacity="0.5"/>

    <!-- Fintech label above the skyline -->
    <text x="1258" y="230" font-family="sans-serif" font-size="46" font-weight="700"
          fill="#3b3a36" text-anchor="middle">Fintech</text>
  </g>

  <!-- near shore, lower left -->
  <path d="M 0 700 L 0 560 Q 120 520 250 540 Q 340 555 380 590 L 400 700 Z"
        fill="#3b3a36" opacity="0.85"/>

  <!-- small person standing on near shore -->
  <g transform="translate(150, 480)">
    <!-- head -->
    <circle cx="0" cy="0" r="10" fill="#3b3a36"/>
    <!-- body -->
    <rect x="-6" y="10" width="12" height="34" rx="5" fill="#3b3a36"/>
    <!-- legs -->
    <rect x="-6" y="42" width="5" height="24" fill="#3b3a36"/>
    <rect x="1" y="42" width="5" height="24" fill="#3b3a36"/>
  </g>
</svg>
